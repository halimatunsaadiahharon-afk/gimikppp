<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <title>Perasmian - Majlis Sambutan Hari Penolong Pegawai Perubatan</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS UTAMA --- */
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            background: #000; /* Latar hitam gelap untuk video */
            color: #fff; 
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        #setup-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; 
            display: flex; justify-content: center; align-items: center; 
            color: #555; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; 
        }

        /* EXIT BUTTON (X) */
        #exit-btn {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            width: 40px; height: 40px; background: rgba(255, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 50%;
            color: white; font-family: sans-serif; font-weight: bold; font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; opacity: 0; transition: opacity 1s;
        }

        /* CONTAINER UTAMA (UNTUK KLIK) */
        #main-container { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 10; display: flex; justify-content: center; align-items: center; 
        }

        /* STYLE VIDEO FULLSCREEN */
        .fullscreen-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Memastikan video penuh skrin tanpa putus */
            display: none; /* Sembunyi secara default */
            z-index: 1;
        }

        /* --- FASA TERAKHIR: OFFICIAL CARD STYLE --- */
        #official-card-container { 
            display: none; opacity: 0; transition: opacity 1.5s; 
            width: 100%; height: 100%; 
            justify-content: center; align-items: center; 
            position: absolute; top: 0; left: 0; z-index: 5;
            background: radial-gradient(circle at center, #002d5a 0%, #000812 100%); /* Latar biru korporat */
        }
        
        .official-card {
            background: rgba(0, 10, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 204, 0.5);
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.3);
            border-radius: 15px;
            padding: 60px 40px;
            width: 85%;
            max-width: 1000px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            transform: scale(0.9); opacity: 0;
            animation: cardPop 1s ease 0.5s forwards;
        }
        @keyframes cardPop { to { transform: scale(1); opacity: 1; } }

        h1 { 
            color: #fff; font-family: 'Montserrat', sans-serif; text-transform: uppercase; 
            font-weight: 900; margin: 0 0 30px 0; line-height: 1.3; 
            text-shadow: 0 0 30px rgba(0, 150, 255, 0.8); 
            font-size: clamp(1.5rem, 4vw, 3.2rem); letter-spacing: 2px; 
        }
        
        .separator-line { 
            width: 120px; height: 3px; background: #00ffcc; margin: 0 auto 30px auto; 
            box-shadow: 0 0 15px #00ffcc; 
        }

        .vip-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .vip-label { font-size: 1rem; color: #aaa; letter-spacing: 4px; text-transform: uppercase; font-weight: 600; }
        
        .vip-name { 
            font-family: 'Montserrat', sans-serif; font-size: clamp(1.2rem, 3vw, 2.2rem); 
            color: #00ffcc; font-weight: 800; text-transform: uppercase; 
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4); margin: 5px 0; 
        }
        
        .vip-role { font-size: 1.2rem; color: #fff; font-weight: 400; opacity: 0.9; text-transform: capitalize;}

        @media screen and (max-width: 768px) { 
            .official-card { padding: 40px 20px; width: 90%; }
        }
    </style>
</head>
<body> 
    <div id="setup-overlay" onclick="startScene()">[ KLIK UNTUK MULA PAPARAN ]</div>
    <div id="exit-btn" onclick="exitSystem(event)">X</div>
    
    <div id="main-container" onclick="handleScreenClick()">
        
        <video id="vid-place" class="fullscreen-video" src="place.mp4" playsinline loop preload="auto"></video>
        
        <video id="vid-access" class="fullscreen-video" src="access.mp4" playsinline loop preload="auto"></video>

        <div id="official-card-container">
            <div class="official-card">
                <h1>MAJLIS SAMBUTAN HARI PENOLONG PEGAWAI PERUBATAN</h1>
                <div class="separator-line"></div>
                <div class="vip-section">
                    <div class="vip-label">DIRASMIKAN OLEH</div>
                    <div class="vip-name">DR SELVANAAYAGAM SHANMUGANATHAN</div>
                    <div class="vip-role">Pengarah Hospital Baling</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const vidPlace = document.getElementById('vid-place');
        const vidAccess = document.getElementById('vid-access');
        const cardContainer = document.getElementById('official-card-container');
        const exitBtn = document.getElementById('exit-btn');

        let currentPhase = 0; 
        // 0: Setup, 1: Loop place.mp4, 2: Loop access.mp4, 3: Papar Kad Rasmi

        // --- TEKNIKAL START ---
        function startScene() {
            document.getElementById('setup-overlay').style.display = 'none';
            exitBtn.style.opacity = '1'; 
            
            // Muatkan video awal
            vidPlace.load();
            vidAccess.load();

            // Minta Fullscreen Browser
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(err => {}); } 
            
            // Masuk Fasa 1 (Mainkan place.mp4)
            currentPhase = 1; 
            vidPlace.style.display = 'block';
            vidPlace.play();
        }

        // --- CONTROLLER KLIK MANUAL ---
        function handleScreenClick() {
            if (currentPhase === 1) {
                // KLIK 1: Tukar dari place.mp4 ke access.mp4
                vidPlace.pause();
                vidPlace.style.display = 'none';
                
                currentPhase = 2;
                vidAccess.style.display = 'block';
                vidAccess.play();

            } else if (currentPhase === 2) {
                // KLIK 2: Tutup video dan buka Kad Rasmi
                vidAccess.pause();
                vidAccess.style.display = 'none';
                
                currentPhase = 3;
                showOfficialCard();
            }
        }

        // --- FASA AKHIR: PAPARAN KAD RASMI ---
        function showOfficialCard() {
            // Tunjuk background korporat & kad rasmi
            cardContainer.style.display = 'flex';
            void cardContainer.offsetWidth; // Reflow untuk animasi pop
            cardContainer.style.opacity = '1';
        }

        // --- EXIT FUNCTION ---
        function exitSystem(e) {
            e.stopPropagation(); // Elak dari trigger handleScreenClick
            if (document.exitFullscreen) document.exitFullscreen();
            try { window.open('', '_self', ''); window.close(); } catch(e) {}
            document.body.innerHTML = ""; document.body.style.background = "black";
            setTimeout(() => { window.location.href = "about:blank"; }, 1000);
        }
    </script>
</body>
</html>
